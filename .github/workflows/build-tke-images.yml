name: Build TKE Images

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3

      - name: Build Web Image
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6
        with:
          context: .
          file: ./web/Dockerfile
          tags: langfuse-web:latest
          outputs: type=docker,dest=langfuse-web.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Worker Image
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6
        with:
          context: .
          file: ./worker/Dockerfile
          tags: langfuse-worker:latest
          outputs: type=docker,dest=langfuse-worker.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload Web Image Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: langfuse-web-image
          path: langfuse-web.tar
          retention-days: 7

      - name: Upload Worker Image Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: langfuse-worker-image
          path: langfuse-worker.tar
          retention-days: 7
