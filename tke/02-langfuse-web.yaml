apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-web
  labels:
    app: langfuse
    component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langfuse
      component: web
  template:
    metadata:
      labels:
        app: langfuse
        component: web
    spec:
      containers:
        - name: langfuse-web
          image: docker.io/langfuse/langfuse:3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: langfuse-config
            - secretRef:
                name: langfuse-secret
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          livenessProbe:
            httpGet:
              path: /api/public/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/public/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: langfuse-web-service
  labels:
    app: langfuse
    component: web
  annotations:
    # 指定使用 TKE 内网 LoadBalancer
    service.kubernetes.io/qcloud-loadbalancer-internal-subnetid: "subnet-xxxxxx" # CHANGEME: 替换为实际的子网 ID
    service.kubernetes.io/qcloud-loadbalancer-network-type: "INTERNAL"
spec:
  type: LoadBalancer
  selector:
    app: langfuse
    component: web
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 3000
